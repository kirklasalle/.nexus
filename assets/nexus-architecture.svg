      <text x="445" y="282" font-size="13" font-weight="600" fill="#ffe0e0" text-anchor="middle">Governance Gate</text>
      <text x="445" y="302" font-size="10.5" fill="#c89b9b" text-anchor="middle">Ten Laws checks &#183; charter digest &#183; fail-closed</text>
