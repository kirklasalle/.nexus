    <text x="1050" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa3c8" text-anchor="middle">3-pane mail &#183; boards &#183; presence rail &#183; ops telemetry</text>
