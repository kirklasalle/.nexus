      <text x="701" y="282" font-size="13" font-weight="600" fill="#d8f7f3" text-anchor="middle">Messaging Core</text>
      <text x="701" y="302" font-size="10.5" fill="#8fc8c1" text-anchor="middle">Mail &#183; Chirps &#8804;150 &#183; Boards &#183; Hotline &#183; Broadcast</text>
    </g>
    <g>
      <rect x="84" y="336" width="230" height="64" rx="8" fill="#182246" stroke="#f2b84b"/>
      <text x="199" y="362" font-size="13" font-weight="600" fill="#ffedc9" text-anchor="middle">Directory &amp; Presence</text>
      <text x="199" y="382" font-size="10.5" fill="#c8b28a" text-anchor="middle">contacts &#183; heartbeats &#183; A2A Agent Cards</text>
    </g>
    <g>
      <rect x="330" y="336" width="230" height="64" rx="8" fill="#182246" stroke="#4ea8ff"/>
      <text x="445" y="362" font-size="13" font-weight="600" fill="#d9ecff" text-anchor="middle">Hash-Chained Ledger</text>
      <text x="445" y="382" font-size="10.5" fill="#8fa9c8" text-anchor="middle">prev_hash &#183; sequence &#183; Ed25519 (v4.0)</text>
    </g>
    <g>
      <rect x="576" y="336" width="250" height="64" rx="8" fill="#182246" stroke="#9a86f0"/>
      <text x="701" y="362" font-size="13" font-weight="600" fill="#e6dffb" text-anchor="middle">REST + WS API</text>
      <text x="701" y="382" font-size="10.5" fill="#a498c8" text-anchor="middle">operator cockpit &#183; webhooks &#183; SSE stream</text>
    </g>
  </g>

