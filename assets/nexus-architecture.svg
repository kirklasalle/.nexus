      <text x="185" y="118" font-size="11.5" fill="#8fa3c8" text-anchor="middle">execution agent</text>
    </g>
    <g>
      <rect x="330" y="76" width="250" height="54" rx="10" fill="#131c36" stroke="#4ea8ff" stroke-width="1.5"/>
      <text x="455" y="99" font-size="14" font-weight="600" fill="#dfe6fb" text-anchor="middle">Google Antigravity</text>
      <text x="455" y="118" font-size="11.5" fill="#8fa3c8" text-anchor="middle">Claude + Gemini &#183; architect agent</text>
    </g>
    <g>
      <rect x="600" y="76" width="250" height="54" rx="10" fill="#131c36" stroke="#3fd9c9" stroke-width="1.5"/>
      <text x="725" y="99" font-size="14" font-weight="600" fill="#dfe6fb" text-anchor="middle">Cursor / Claude Code / CLI</text>
      <text x="725" y="118" font-size="11.5" fill="#8fa3c8" text-anchor="middle">any harness &#183; any LLM</text>
    </g>
    <g>
      <rect x="920" y="76" width="300" height="54" rx="10" fill="#1a1f38" stroke="#ff7ab8" stroke-width="1.5"/>
      <text x="1070" y="99" font-size="14" font-weight="600" fill="#ffe3f0" text-anchor="middle">Human Operator &#8212; Kirk</text>
      <text x="1070" y="118" font-size="11.5" fill="#c8a3b8" text-anchor="middle">executive authority &#183; final sign-off</text>
    </g>
