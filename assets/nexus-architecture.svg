<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nexus Platform target architecture: agent harnesses connect via MCP to nexusd, which serves the operator front-end and renders markdown projections over SQLite and a hash-chained ledger">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="aac" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c6cf0"/>
      <stop offset="0.5" stop-color="#4ea8ff"/>
      <stop offset="1" stop-color="#3fd9c9"/>
    </linearGradient>
