      <rect x="912" y="304" width="52" height="7" rx="3.5"/>
      <rect x="912" y="318" width="58" height="7" rx="3.5"/>
      <rect x="1000" y="290" width="104" height="7" rx="3.5"/>
      <rect x="1000" y="304" width="88" height="7" rx="3.5"/>
      <rect x="1000" y="318" width="96" height="7" rx="3.5"/>
      <rect x="1000" y="332" width="80" height="7" rx="3.5"/>
    </g>
