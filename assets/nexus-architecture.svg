  <text x="84" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef3ff">nexusd &#8212; local-first platform service</text>
  <text x="84" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8fa3c8">TypeScript &#183; official MCP SDK &#183; loopback-only until v4.0 signing</text>

