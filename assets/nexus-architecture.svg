    <rect x="992" y="278" width="120" height="118" rx="6" fill="#182246" stroke="#3a4a74"/>
    <rect x="1120" y="278" width="76" height="118" rx="6" fill="#182246" stroke="#3a4a74"/>
    <g fill="#5f7099">
