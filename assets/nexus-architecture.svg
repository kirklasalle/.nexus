      <path d="M0 0 L10 5 L0 10 z" fill="#6f86b8"/>
    </marker>
  </defs>

  <rect width="1280" height="560" rx="14" fill="url(#abg)"/>
  <rect x="1" y="1" width="1278" height="558" rx="13" stroke="#2a3654" stroke-opacity="0.8" fill="none"/>

  <text x="640" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef3ff" text-anchor="middle">Nexus Platform &#8212; Target Architecture (v3.0 &#8594; v4.0)</text>

  <!-- ===== Harness row ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
