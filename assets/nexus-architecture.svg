      <rect x="1128" y="304" width="48" height="7" rx="3.5" fill="#4ea8ff" opacity="0.8"/>
      <rect x="1128" y="318" width="54" height="7" rx="3.5" fill="#7c6cf0" opacity="0.8"/>
