      <text x="1050" y="481" font-size="13.5" font-weight="600" fill="#c9d4ee" text-anchor="middle">Federation (v4.x, optional)</text>
      <text x="1050" y="501" font-size="10.5" fill="#8fa3c8" text-anchor="middle">A2A tasks &#183; SMTP / AgentMail gateway &#183; multi-room</text>
